# MailSalon configuration embedded into the binary at build time.
# Edit this file before running `go build` to change the built-in defaults.
#
# Values do not need shell quotes. Argument fields use shell-like quoting only
# when a single argument itself contains spaces.

maildir = ~/Maildir/INBOX
download_dir = ~/Downloads
from = 

offlineimap = offlineimap
offlineimap_args =

msmtp = msmtp
msmtp_args = -t

startup_sync = true
